<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taste Liberia Menu</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <header>
    <h1>Taste Liberia</h1>
    <p>Authentic Liberian Cuisine</p>
  </header>

  <main>
    <section class="menu">
      <h2>Our Menu</h2>
      <div class="menu-item">
        <h3>Jollof Rice</h3>
        <p>$10</p>
        <button class="pay-button" data-item="Jollof Rice" data-price="1000">Pay with Card</button>
      </div>
      <div class="menu-item">
        <h3>Cassava Leaf</h3>
        <p>$12</p>
        <button class="pay-button" data-item="Cassava Leaf" data-price="1200">Pay with Card</button>
      </div>
      <div class="menu-item">
        <h3>Fufu & Soup</h3>
        <p>$15</p>
        <button class="pay-button" data-item="Fufu & Soup" data-price="1500">Pay with Card</button>
      </div>
    </section>
  </main>

  <script>
    const stripe = Stripe("pk_live_51SLPuYIRB5h9kKSgqV6JOB9LWX6CcoSql3aNbFIzpabBCBBU2pzct7QLi7EaBZ3HNhzdgiEtxpG3kqPHD06kDXfQ00S6lRKCOq");

    document.querySelectorAll(".pay-button").forEach((button) => {
      button.addEventListener("click", async () => {
        const itemName = button.getAttribute("data-item");
        const itemPrice = button.getAttribute("data-price");

        const response = await fetch("http://localhost:3000/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ itemName, itemPrice }),
        });

        const session = await response.json();
        await stripe.redirectToCheckout({ sessionId: session.id });
      });
    });
  </script>
</body>
</html>
